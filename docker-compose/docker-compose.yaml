services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: mysql8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "Zhy26825.+8"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: sknacos
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/mysql-data:/var/lib/mysql
      - ./mysql/mysql-conf:/etc/mysql/conf.d
      - ./mysql/logs:/var/log/mysql
    command:
      - "--default-authentication-plugin=caching_sha2_password"
      - "--bind-address=0.0.0.0"
      - "--max_connections=500"
      - "--innodb_buffer_pool_size=512M"
      - "--slow_query_log=1"
      - "--slow_query_log_file=/var/log/mysql/slow.log"
      - "--long_query_time=2"
      - "--default-time-zone=+08:00"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-pZhy26825.+8",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - app-network

  # Redis 缓存
  redis:
    image: redis:7.0
    container_name: redis7
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - app-network

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq3
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: hutongsk
      RABBITMQ_DEFAULT_PASS: hutongsk123
      TZ: Asia/Shanghai
    volumes:
      - ./rabbit-compose/rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - app-network

  # Nacos 注册中心
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: nacos3
    restart: unless-stopped
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/sknacos?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      MYSQL_SERVICE_HOST: "mysql"
      MYSQL_SERVICE_PORT: "3306"
      MYSQL_SERVICE_DB_NAME: sknacos
      MYSQL_SERVICE_USER: OnePiece
      MYSQL_SERVICE_PASSWORD: "Zhy26825.+8"
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: "Ui0YwTlSg4dAE96B8lI1BVDs/0mOuFxPPITFHx+vdIQ="
      NACOS_AUTH_IDENTITY_KEY: nacos_identity_key
      NACOS_AUTH_IDENTITY_VALUE: nacos_identity_value
      JVM_XMS: "256m"
      JVM_XMX: "512m"
      TZ: Asia/Shanghai
    volumes:
      - ./nacos/logs:/home/nacos/logs
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8848/nacos/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - app-network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/ssl:/etc/nginx/ssl:ro
    environment:
      TZ: Asia/Shanghai
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost/index.html > /dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
