services:
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: nacos-standalone
    restart: always
    environment:
      - MODE=standalone
      
      # 【核心修复】手动指定完整的 JDBC 连接 URL
      # 重点：末尾增加了 &allowPublicKeyRetrieval=true 以允许 MySQL 8.0+ 的公钥检索
      - SPRING_DATASOURCE_URL=jdbc:mysql://43.226.46.171:33066/sknacos?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      
      # 以下变量作为备用或文档说明，实际连接以上面的 SPRING_DATASOURCE_URL 为准
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=43.226.46.171
      - MYSQL_SERVICE_PORT=33066
      - MYSQL_SERVICE_DB_NAME=sknacos
      - MYSQL_SERVICE_USER=OnePiece
      - MYSQL_SERVICE_PASSWORD=Zhy26825.+8
      
      # Nacos 认证配置
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=Ui0YwTlSg4dAE96B8lI1BVDs/0mOuFxPPITFHx+vdIQ=
      - NACOS_AUTH_IDENTITY_KEY=nacos_identity_key
      - NACOS_AUTH_IDENTITY_VALUE=nacos_identity_value
      
    volumes:
      - ./logs:/home/nacos/logs
    ports:
      - "8848:8848"
      - "8080:8080"
      - "9848:9848"
      - "9849:9849"
    networks:
      - nacos-network

networks:
  nacos-network:
    driver: bridge
