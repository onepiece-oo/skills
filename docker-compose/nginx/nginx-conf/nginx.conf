# 定义 Nginx 运行的工作进程数，auto 表示根据 CPU 核心数自动调整
worker_processes auto;

# 【修正】指令名称应为 error_log (原配置为 error_log，但通常建议检查拼写，这里确认无误)
# 定义全局错误日志级别
error_log /var/log/nginx/error.log warn;

# 定义 PID 文件位置
pid /var/run/nginx.pid;

# 定义工作进程打开文件描述符的数量上限
worker_rlimit_nofile 65535;

events {
    # 【优化】每个工作进程并发处理连接的最大数量，默认 1024 偏小，建议调大
    worker_connections 4096;
    
    # 【优化】使用 epoll 模型，Linux 下性能最佳
    use epoll;
    
    # 允许一个工作进程同时接受多个新连接
    multi_accept on;
}

http {
    # 包含 MIME 类型定义文件 
    include /etc/nginx/mime.types;
    # 默认 MIME 类型
    default_type application/octet-stream;

    # 【优化】隐藏 Nginx 版本号，提高安全性
    server_tokens off;

    # 定义访问日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 定义访问日志路径和格式
    access_log /var/log/nginx/access.log main;

    # 开启高效文件传输模式
    sendfile on;
    
    # 启用 TCP_NOPUSH，与 sendfile 一起使用，优化性能
    tcp_nopush on;
    
    # 启用 TCP_NODELAY，优化小数据包传输
    tcp_nodelay on;

    # 保持连接超时时间
    keepalive_timeout 65;

    # 【重要优化】客户端请求体大小限制
    # 默认 1M 太小，容易导致上传失败或大型前端资源加载被拒 (413 错误)
    # 建议设置为 20M 或更高，根据实际需求调整
    client_max_body_size 20M;

    # 客户端请求头缓冲区大小
    client_header_buffer_size 1k;
    
    # 默认请求缓冲区大小
    large_client_header_buffers 4 4k;

    # 开启 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    # 【优化】明确指定需要压缩的文件类型，避免压缩图片等二进制文件
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # 定义虚拟主机服务器块
    server {
        # 监听 80 端口
        listen 80;
        # 如果需要使用 IPv6，可以取消下面这行的注释
        # listen [::]:80;

        # 定义服务器名称，可以是域名或 IP _ 表示匹配任何域名/IP
        server_name _;

        location / {
            root  /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|woff|woff2|ttf|eot|svg)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # (可选) 定义错误页面
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
            internal; 
        }
        
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
