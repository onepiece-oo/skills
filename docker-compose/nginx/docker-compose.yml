#docker-compose.yml
services:
  nginx:
    image: nginx:alpine
    container_name: my-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 挂载配置文件 (只读)
      - ./nginx-conf/nginx.conf:/etc/nginx/nginx.conf:ro
      # 挂载网站静态文件 (只读)
      # 【重要】请确保宿主机的 ./html 目录下至少有一个 index.html 文件
      - ./html:/usr/share/nginx/html:ro
      # (可选) 挂载日志目录，方便查看日志，避免日志写在容器内丢失
      - ./logs:/var/log/nginx
    environment:
      - TZ=Asia/Shanghai
    # networks:
    #   - web-network

# networks:
#   web-network:
#     driver: bridge
