<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海贼笔记 - One Piece Log</title>
<style>
  /* ========== 暗色海贼主题 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* 背景层 */
    --bg-deep: #080c16;
    --bg-page: #0b1020;
    --bg-card: #111927;
    --bg-card-hover: #162032;
    --bg-sidebar: #090d18;
    --bg-sensitivity: #0f1522;
    --bg-input: #0c1120;

    /* 文字层 */
    --text-primary: #d6cfbf;
    --text-secondary: #9baabf;
    --text-muted: #4e5f78;

    /* 海贼色彩板 — 草帽团核心 */
    --luffy-red: #c0392b;
    --luffy-red-glow: rgba(192, 57, 43, 0.3);
    --nami-orange: #e8a84c;
    --nami-orange-glow: rgba(232, 168, 76, 0.2);
    --sanji-blue: #3498db;
    --sanji-blue-glow: rgba(52, 152, 219, 0.2);

    /* 金箔色 — 大海报/悬赏令 */
    --gold: #c9a66b;
    --gold-dim: #7a6544;
    --gold-glow: rgba(201, 166, 107, 0.2);

    /* 通用 */
    --danger: #e74c3c;
    --success: #2ecc71;

    /* 装饰 */
    --border-card: #1a2436;
    --border-gold: rgba(201, 166, 107, 0.12);
    --radius: 6px;
    --shadow-card: 0 1px 6px rgba(0, 0, 0, 0.3);
    --shadow-gold: 0 0 16px rgba(201, 166, 107, 0.08);
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    display: flex;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 背景纹理 — 极淡的网格模拟航海地图，带缓慢流动 */
  @keyframes gridDrift {
    from { background-position: 0 0; }
    to { background-position: 60px 60px; }
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(var(--border-gold) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-gold) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.2;
    pointer-events: none;
    z-index: 0;
    animation: gridDrift 8s linear infinite;
  }

  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(201, 166, 107, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(52, 152, 219, 0.02) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ========== 折叠按钮 ========== */
  .collapse-btn {
    position: fixed;
    left: 280px;
    top: 18px;
    width: 18px;
    height: 32px;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-left: none;
    border-radius: 0 6px 6px 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    color: var(--text-muted);
    font-size: 9px;
  }
  .collapse-btn:hover {
    background: var(--bg-card-hover);
    color: var(--gold);
    box-shadow: var(--shadow-gold);
    transform: scaleX(1.3);
  }
  .collapse-btn:active {
    transform: scaleX(0.85);
  }
  .collapse-btn.collapsed {
    left: 0;
    border-left: 1px solid var(--border-card);
    border-radius: 0 6px 6px 0;
    border-right: none;
  }
  .collapse-btn::before {
    content: '\2B05';
    display: block;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .collapse-btn.collapsed::before {
    content: '\27A1';
  }

  /* ========== 侧边栏动画 ========== */
  .sidebar {
    width: 280px;
    background: var(--bg-sidebar);
    padding: 24px 16px;
    position: fixed;
    height: 100vh;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #1a2540 transparent;
    border-right: 1px solid var(--border-card);
    z-index: 10;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
  }
  .sidebar.collapsed {
    transform: translateX(-280px);
    opacity: 0;
    pointer-events: none;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: #1a2540; border-radius: 2px; }

  .sidebar-header {
    padding-bottom: 14px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--border-card);
  }

  .sidebar-title {
    font-size: 18px;
    font-weight: 800;
    color: var(--gold);
    text-align: center;
    letter-spacing: 4px;
    line-height: 1.2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    animation: sidebarGlow 3s ease-in-out infinite;
  }

  @keyframes sidebarGlow {
    0%, 100% { text-shadow: 0 0 12px var(--gold-glow); }
    50% { text-shadow: 0 0 20px rgba(201, 166, 107, 0.35); }
  }

  .sidebar-title::before {
    content: '\1F3D3';
    font-size: 20px;
    filter: drop-shadow(0 0 4px rgba(201, 166, 107, 0.3));
    animation: mapPulse 4s ease-in-out infinite;
  }

  @keyframes mapPulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  .sidebar-eng {
    font-size: 9px;
    color: var(--gold-dim);
    text-align: center;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 1px;
    padding: 2px 0;
    border-top: 1px solid rgba(201, 166, 107, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .sidebar-eng::before { content: '\2693'; opacity: 0.5; font-size: 10px; }

  /* 平台列表项 — 宝藏地图卷轴风格 */
  .sidebar h3 {
    font-size: 13px;
    font-weight: 600;
    color: #e2dcc8;
    margin: 4px 0;
    padding: 6px 16px 6px 38px; /* 左38px容纳圆点+间隙；右16px给箭头留足安全间距 */
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    user-select: none;
    background: rgba(15, 22, 34, 0.4);
    border: 1px solid transparent;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sidebar h3:hover {
    background: rgba(201, 166, 107, 0.2);
    color: #fff;
    transform: translateX(3px);
    box-shadow: 0 2px 8px rgba(201, 166, 107, 0.2);
    border-color: var(--border-gold);
  }

  /* 左侧指示圆点 — 所有平台统一，默认金色呼吸 */
  .sidebar h3::before {
    content: '';
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 6px var(--gold-glow);
    animation: pointGlow 1.5s infinite;
  }
  @keyframes pointGlow {
    0%, 100% { opacity: 1; transform: translateY(-50%) scale(1); }
    50% { opacity: 0.7; transform: translateY(-50%) scale(1.1); }
  }
  /* 悬停时增强发光效果 */
  .sidebar h3:hover::before {
    box-shadow: 0 0 12px var(--gold-glow);
    animation: none;
  }
  /* 折叠状态下变暗 */
  .sidebar h3.folded::before,
  .sidebar h3[data-group].folded::before {
    background: #4e5f78;
    box-shadow: none;
    opacity: 0.5;
    animation: none;
  }

  /* 折叠指示器 — 位于右侧，更大的可点击区域 */
  .fold-trigger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    margin-left: 12px; /* 文字右侧留出间隙 */
    font-size: 9px;
    color: #8a9bb5;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    border-radius: 3px;
  }
  .fold-trigger:hover {
    background: rgba(201, 166, 107, 0.2);
    color: var(--gold);
    transform: rotate(180deg);
  }
  .sidebar h3.folded .fold-trigger {
    transform: rotate(-90deg);
  }

  /* 无实例的 plain h3 — 现在使用与其他平台相同的圆点和背景 */
  .sidebar h3:not([data-group]) {
    padding-left: 38px; /* 统一左内边距（圆点10px + 间距28px） */
    background: rgba(15, 22, 34, 0.4); /* 统一背景色 */
    border: 1px solid transparent; /* 统一透明边框 */
  }
  .sidebar h3:not([data-group]):hover {
    background: rgba(201, 166, 107, 0.2);
    color: #fff;
    transform: translateX(3px);
    box-shadow: 0 2px 8px rgba(201, 166, 107, 0.2);
    border-color: var(--border-gold);
  }
  .sidebar h3:not([data-group]) a {
    display: block;
    width: 100%;
  }

  /* 实例子项 — 绳索锚点，带渐进式动画 */
  .sidebar h4 {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-muted);
    margin: 2px 0;
    padding: 3px 8px 3px 42px; /* 更深的缩进 */
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    opacity: 0;
    animation: slideInLeft 0.3s forwards;
  }
  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .sidebar h4::before {
    content: '\2693';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    opacity: 0.4;
    transition: all 0.2s;
  }
  .sidebar h4:hover {
    color: var(--text-secondary);
    background: rgba(212, 165, 116, 0.08);
    border-left: 2px solid var(--gold);
    padding-left: 38px;
  }
  .sidebar h4:hover::before {
    opacity: 0.8;
    color: var(--gold);
  }

  /* 折叠时隐藏实例 */
  .sidebar.hide-folded h4 {
    display: none;
    animation: foldOut 0.2s reverse;
  }
  @keyframes foldOut {
    to { opacity: 0; transform: translateX(-10px); }
  }

  /* 实例子项 — 绳索锚点 */
  .sidebar h4 {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-muted);
    margin: 1px 0;
    padding: 3px 8px 3px 28px;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 1px solid transparent;
    position: relative;
  }
  .sidebar h4::before {
    content: '\2693';
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    opacity: 0.5;
  }
  .sidebar h4:hover {
    color: var(--text-secondary);
    border-left-color: var(--border-gold);
  }
  .sidebar h4:hover::before {
    opacity: 0.8;
  }

  .sidebar a { text-decoration: none; color: inherit; display: block; }

  .content {
    margin-left: 280px;
    padding: 32px 52px 60px;
    flex: 1;
    max-width: 960px;
    position: relative;
    z-index: 1;
    transition: margin-left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* 锚点滚动时顶部内边距，避免被固定元素遮挡 */
  .content h2,
  .content h3,
  .resource-card {
    scroll-margin-top: 100px;
  }

  .content-header {
    margin-bottom: 40px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border-gold);
    animation: fadeSlideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) both;
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeSlideInDelay1 {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeSlideInDelay2 {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .content-title {
    font-size: 26px;
    font-weight: 800;
    color: var(--gold);
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 2px;
    text-shadow: 0 0 16px var(--gold-glow);
    animation: fadeSlideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  .content-title::before {
    content: '\1F451';
    font-size: 28px;
    filter: drop-shadow(0 0 6px var(--gold-glow));
    display: inline-block;
    animation: hatBounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
  }

  @keyframes hatBounce {
    from { opacity: 0; transform: scale(0.3) rotate(-20deg); }
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .content-subtitle {
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
    animation: fadeSlideInDelay1 0.5s 0.15s cubic-bezier(0.4, 0, 0.2, 1) both;
  }

  .meta {
    animation: fadeSlideInDelay2 0.5s 0.25s cubic-bezier(0.4, 0, 0.2, 1) both;
  }

  .content-subtitle {
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* 元信息行 */
  .meta {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--text-muted);
  }
  .meta-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .meta-sep {
    width: 2px;
    height: 2px;
    background: var(--text-muted);
    border-radius: 50%;
    opacity: 0.5;
  }
  .meta-tag {
    display: inline-flex;
    align-items: center;
    padding: 1px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 500;
    color: var(--gold-dim);
    border: 1px solid rgba(201, 166, 107, 0.12);
    background: rgba(201, 166, 107, 0.05);
  }

  /* 平台标题 — 底部金线生长 */
  .content h2 {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 36px 0 14px;
    padding-bottom: 10px;
    position: relative;
    display: flex;
    align-items: center;
    animation: fadeSlideIn 0.45s cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  .content h2::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 48px;
    height: 2px;
    background: linear-gradient(90deg, var(--gold), transparent);
    border-radius: 1px;
    opacity: 0;
    transition: opacity 0.4s 0.2s, width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .content h2.animate-line::after {
    opacity: 0.6;
  }

  /* 实例舰队标题 */
  .section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 24px 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-label::before {
    content: '\26F5';
    font-size: 14px;
    opacity: 0.7;
  }

  /* ========== 资源卡片 — 带入场动画 ========== */
  .resource-card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-card);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    animation: cardStaggerIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) both;
  }

  @keyframes cardStaggerIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 顶部金线 — hover 时生长 */
  .resource-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0;
    transition: opacity 0.3s, width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0;
    left: 50%;
    transform: translateX(-50%);
  }
  .resource-card:hover {
    background: var(--bg-card-hover);
    box-shadow: var(--shadow-card), var(--shadow-gold);
    transform: translateY(-2px);
  }
  .resource-card:hover::before {
    opacity: 1;
    width: 100%;
  }

  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-card);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-title::before {
    content: '\1F3D3';
    font-size: 14px;
    filter: drop-shadow(0 0 3px rgba(201, 166, 107, 0.2));
    display: inline-block;
    animation: mapPulse 5s ease-in-out infinite;
  }

  /* ========== 信息行 ========== */
  .info-row {
    display: flex;
    align-items: baseline;
    margin: 5px 0;
    font-size: 13px;
    gap: 4px;
  }

  .field-label {
    color: var(--text-muted);
    min-width: 68px;
    font-weight: 600;
    font-size: 12px;
    flex-shrink: 0;
  }

  .field-value {
    color: var(--text-primary);
    word-break: break-all;
    flex: 1;
    line-height: 1.6;
    padding: 2px 8px;
    margin: -2px -8px;
    border-radius: 4px;
    transition: all 0.15s;
    user-select: none;
  }

  .field-value a {
    color: var(--nami-orange);
    text-decoration: none;
    transition: color 0.15s;
  }
  .field-value a:hover {
    color: #f0bc60;
    text-decoration: underline;
  }

  .field-value.copyable { cursor: pointer; }
  .field-value.copyable:hover { background: rgba(201, 166, 107, 0.05); }
  .field-value.copied-flash {
    background: rgba(46, 204, 113, 0.12) !important;
    color: var(--success) !important;
  }

  /* ========== 敏感行 — 封印风格 ========== */
  .sensitive-row {
    background: var(--bg-sensitivity);
    border: 1px solid var(--border-gold);
    border-radius: var(--radius);
    padding: 9px 14px;
    margin: 8px 0;
  }
  .sensitive-row .field-label { color: var(--gold-dim); }

  .password-masked {
    letter-spacing: 3px;
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 13px;
    cursor: pointer;
    color: var(--luffy-red);
    transition: all 0.15s;
    opacity: 0.8;
  }
  .password-masked:hover {
    opacity: 1;
    text-shadow: 0 0 8px var(--luffy-red-glow);
    animation: pwGlow 1.2s ease-in-out infinite;
  }

  @keyframes pwGlow {
    0%, 100% { text-shadow: 0 0 8px var(--luffy-red-glow); }
    50% { text-shadow: 0 0 14px rgba(192, 57, 43, 0.5); }
  }

  /* ========== 弹窗 — 恶魔果实封印 ========== */
  .pw-dialog {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(5, 8, 16, 0.8);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .pw-dialog-inner {
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 10px;
    padding: 28px 32px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px var(--gold-glow);
    min-width: 340px;
    animation: slideUp 0.2s;
    text-align: center;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .pw-dialog-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 16px;
    letter-spacing: 1px;
  }
  .pw-dialog-inner input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    font-size: 14px;
    outline: none;
    margin-bottom: 8px;
    background: var(--bg-input);
    color: var(--text-primary);
    transition: border-color 0.15s;
  }
  .pw-dialog-inner input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 8px var(--gold-glow);
  }
  .pw-error {
    color: var(--danger);
    font-size: 12px;
    display: none;
    margin-bottom: 8px;
  }
  .pw-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 4px;
  }

  .pw-cancel {
    background: var(--bg-input);
    color: var(--text-secondary);
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    padding: 7px 18px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .pw-cancel:hover { background: var(--bg-card-hover); }

  .pw-confirm {
    background: var(--luffy-red);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 7px 18px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 0 10px var(--luffy-red-glow);
  }
  .pw-confirm:hover { background: #a93226; }

  /* ========== Toast ========== */
  .toast {
    position: fixed;
    top: 20px;
    right: 24px;
    background: var(--bg-card);
    color: var(--text-primary);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.3s;
    z-index: 9999;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    border-left: 3px solid var(--gold);
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ========== 响应式 ========== */
  @media (max-width: 768px) {
    .sidebar {
      width: 280px;
      transform: translateX(-280px);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
    }
    .sidebar.mobile-open {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }
    .content { margin-left: 0; padding: 20px 20px 40px; }
    .content-title { font-size: 22px; }
    .collapse-btn { display: none; }
    /* 移动端移动端菜单按钮 */
    .mobile-menu-btn { display: flex !important; }
  }
</style>

  var MASTER_PW = '123456';
  var GATEWAY_UNLOCKED = false;

  /* ---------- 侧边栏渲染 ---------- */
  function renderSidebar() {
    var sidebar = document.querySelector('.sidebar');
    var html = '<div class="sidebar-header"><h1 class="sidebar-title">海贼笔记</h1>';
    html += '<p class="sidebar-eng">ONE PIECE LOG BOOK</p></div>';
    DATA.platforms.forEach(function(platform, idx) {
      var groupKey = 'platform-' + idx;
      var isFolded = FOLDED_GROUPS[groupKey];
      var hasInstances = platform.instances && platform.instances.length > 0;

      if (hasInstances) {
        // 有实例：添加交互属性，可折叠（只有小三角触发，点击标题文字仅跳转）
        html += '<h3 data-group="' + groupKey + '"><a href="#platform-' + escapeAttr(platform.name) + '">' + platform.name + '</a><span class="fold-trigger" title="收起/展开实例">▼</span></h3>';
      } else {
        // 无实例：普通链接，不带折叠属性
        html += '<h3><a href="#platform-' + escapeAttr(platform.name) + '">' + platform.name + '</a></h3>';
      }

      if (hasInstances) {
        platform.instances.forEach(function(instance) {
          var instanceNameSlug = instance.name.replace(/\s/g, '-');
          html += '<h4 class="' + groupKey + '-child"' + (isFolded ? ' style="display:none"' : '') + '><a href="#instance-' + escapeAttr(platform.name).replace(/\s/g, '-') + '-' + escapeAttr(instanceNameSlug) + '">' + instance.name + '</a></h4>';
        });
      }
    });
    sidebar.innerHTML = html;
  }

  function toggleGroup(event, groupKey) {
    if (event) event.stopPropagation(); // 防止事件冒泡到 a 标签，避免同时触发跳转
    FOLDED_GROUPS[groupKey] = !FOLDED_GROUPS[groupKey];
    var isFolded = FOLDED_GROUPS[groupKey];
    var h3 = document.querySelector('.sidebar h3[data-group="' + groupKey + '"]');
    if (h3) h3.classList.toggle('folded', isFolded);
    var children = document.querySelectorAll('.' + groupKey + '-child');
    for (var i = 0; i < children.length; i++) {
      children[i].style.display = isFolded ? 'none' : '';
    }
  }

  function toggleSidebar() {
    SIDEBAR_COLLAPSED = !SIDEBAR_COLLAPSED;
    var sidebar = document.querySelector('.sidebar');
    var btn = document.querySelector('.collapse-btn');
    var content = document.querySelector('.content');
    if (SIDEBAR_COLLAPSED) {
      sidebar.classList.add('collapsed');
      btn.classList.add('collapsed');
      content.style.marginLeft = '0';
    } else {
      sidebar.classList.remove('collapsed');
      btn.classList.remove('collapsed');
      content.style.marginLeft = '280px';
    }
  }

  /* ---------- 内容区渲染 ---------- */
  function renderContent() {
    var content = document.querySelector('.content');
    var meta = DATA.meta;
    var html = '<div class="content-header"><div class="content-title">海贼笔记</div>';
    html += '<p class="content-subtitle">☠ ONE PIECE CREDENTIAL LOG ☠</p>';
    html += '<div class="meta">';
    html += '<span class="meta-item">📅 ' + meta.created + '</span>';
    html += '<span class="meta-sep"></span>';
    html += '<span class="meta-item">🔄 ' + meta.updated + '</span>';
    html += '<span class="meta-sep"></span>';
    html += meta.tags.map(function(t) { return '<span class="meta-tag">' + t + '</span>'; }).join('');
    html += '</div></div>';

    DATA.platforms.forEach(function(platform, idx) {
      html += '<h2 id="platform-' + escapeAttr(platform.name) + '" style="animation-delay: ' + (0.35 + idx * 0.12) + 's">' + platform.name + '</h2>';
      html += renderPlatformCard(platform);
      if (platform.instances && platform.instances.length > 0) {
        html += '<p class="section-label">实例舰队</p>';
        platform.instances.forEach(function(instance, instIdx) {
          html += renderInstanceCard(instance, platform.name, instIdx);
        });
      }
    });

    content.innerHTML = html;
  }

  /* ---------- 卡片渲染 ---------- */
  function renderPlatformCard(platform, cardIndex) {
    var slug = platform.name.replace(/\s/g, '-');
    var delay = (0.4 + cardIndex * 0.12);
    var html = '<div class="resource-card" style="animation-delay: ' + delay + 's"><div class="card-title">' + platform.name + ' — 平台据点</div>';
    html += renderFields({
      "网址": platform.url,
      "登录方式": platform.loginMethod,
      "用户名": platform.username || '-',
      "密码": platform.password || '',
      "备注": platform.note || ''
    }, 'platform-' + slug);
    html += '</div>';
    return html;
  }

  function renderInstanceCard(instance, platformName, cardIndex) {
    var slug = platformName.replace(/\s/g, '-');
    var instanceNameSlug = instance.name.replace(/\s/g, '-');
    var delay = (0.5 + (cardIndex || 0) * 0.08);
    // 外层 div 加上 id，作为锚点目标
    var html = '<div id="instance-' + escapeAttr(slug) + '-' + escapeAttr(instanceNameSlug) + '" class="resource-card" style="animation-delay: ' + delay + 's"><div class="card-title">' + instance.name + '</div>';
    html += renderFields(buildInstanceFields(instance), 'platform-' + slug + '-' + instanceNameSlug);
    html += '</div>';
    return html;
  }

  function buildInstanceFields(instance) {
    var f = {};
    if (instance.host) f["Host"] = instance.host;
    if (instance.port) f["Port"] = instance.port;
    if (instance.dbName) f["数据库名"] = instance.dbName;
    if (instance.dbUser) f["数据库账号"] = instance.dbUser;
    if (instance.status) f["状态"] = instance.status;
    if (instance.version) f["版本"] = instance.version;
    if (instance.region) f["节点区域"] = instance.region;
    if (instance.type) f["资源类型"] = instance.type;
    if (instance.createdAt) f["创建时间"] = instance.createdAt;
    if (instance.expiresAt) f["到期时间"] = instance.expiresAt;
    if (instance.password) f["密码"] = instance.password;
    if (instance.note) f["备注"] = instance.note;
    return f;
  }

  function renderFields(fieldsMap, pwPrefix) {
    var html = '';
    for (var key in fieldsMap) {
      var val = fieldsMap[key];
      if (key === '密码') {
        if (!val) continue;
        // pwPrefix 由 caller 提供不含 "-密码" 的后缀，此处拼接
        html += '<div class="sensitive-row"><div class="info-row" style="margin:0">';
        html += '<span class="field-label">' + key + '</span>';
        html += '<span class="field-value password-masked" data-pw-key="' + pwPrefix + '-密码">••••••••</span>';
        html += '</div></div>';
      } else {
        var isUrl = /^https?:\/\//i.test(val);
        html += '<div class="info-row"><span class="field-label">' + key + '</span>';
        if (isUrl) {
          html += '<span class="field-value copyable" data-value="' + escapeAttr(val) + '"><a href="' + escapeAttr(val) + '" target="_blank">' + escapeHtml(val) + '</a></span>';
        } else {
          html += '<span class="field-value copyable" data-value="' + escapeAttr(val) + '">' + escapeHtml(String(val)) + '</span>';
        }
        html += '</div>';
      }
    }
    return html;
  }

  /* ---------- 工具函数 ---------- */
  function escapeHtml(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }

  function escapeAttr(s) {
    return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function showToast(msg) {
    var t = document.getElementById('global-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 1500);
  }

  function copyValue(span) {
    var text = span.getAttribute('data-value') || span.textContent.trim();
    navigator.clipboard.writeText(text).then(function() {
      span.classList.add('copied-flash');
      setTimeout(function() { span.classList.remove('copied-flash'); }, 800);
      showToast('已复制: ' + text.substring(0, 30));
    });
  }

  function handlePasswordClick(span) {
    if (GATEWAY_UNLOCKED) {
      copyPasswordByKey(span.getAttribute('data-pw-key'));
      return;
    }
    var overlay = document.createElement('div');
    overlay.className = 'pw-dialog';
    overlay.innerHTML = '<div class="pw-dialog-inner">'
      + '<div class="pw-dialog-title">🔐 输入主密码解锁</div>'
      + '<input type="password" placeholder="请输入主密码...">'
      + '<div class="pw-error">密码错误，请重试</div>'
      + '<div class="pw-actions">'
      + '<button class="pw-cancel">取消</button>'
      + '<button class="pw-confirm">确认</button>'
      + '</div></div>';
    document.body.appendChild(overlay);
    var input = overlay.querySelector('input');
    var errorEl = overlay.querySelector('.pw-error');
    var cancelBtn = overlay.querySelector('.pw-cancel');
    var confirmBtn = overlay.querySelector('.pw-confirm');
    input.focus();

    function close() { overlay.remove(); }

    confirmBtn.onclick = function() {
      if (input.value === MASTER_PW) {
        GATEWAY_UNLOCKED = true;
        copyPasswordByKey(span.getAttribute('data-pw-key'));
        close();
        showToast('验证通过，之后密码点击即可复制');
      } else {
        errorEl.style.display = 'block';
        input.value = '';
        input.focus();
      }
    };

    cancelBtn.onclick = close;
    input.onkeydown = function(e) {
      if (e.key === 'Enter') confirmBtn.click();
      if (e.key === 'Escape') close();
    };
    overlay.onclick = function(e) { if (e.target === overlay) close(); };
  }

  function copyPasswordByKey(pwKey) {
    var result = findPasswordByKey(pwKey);
    if (result) {
      navigator.clipboard.writeText(result).then(function() { showToast('密码已复制'); });
    }
  }

  function findPasswordByKey(pwKey) {
    for (var i = 0; i < DATA.platforms.length; i++) {
      var platform = DATA.platforms[i];
      var slug = platform.name.replace(/\s/g, '-');
      var pKey = 'platform-' + slug + '-密码';
      if (pwKey === pKey && platform.password) return platform.password;
      if (platform.instances) {
        for (var j = 0; j < platform.instances.length; j++) {
          var inst = platform.instances[j];
          var iKey = 'platform-' + slug + '-' + inst.name.replace(/\s/g, '-') + '-密码';
          if (pwKey === iKey && inst.password) return inst.password;
        }
      }
    }
    return null;
  }

  function createCollapseBtn() {
    var btn = document.createElement('div');
    btn.className = 'collapse-btn';
    btn.onclick = toggleSidebar;
    btn.title = SIDEBAR_COLLAPSED ? '展开侧栏' : '收起侧栏';
    document.body.appendChild(btn);
  }

  /* ---------- 初始化 ---------- */
  document.addEventListener('DOMContentLoaded', function() {
    renderSidebar();
    renderContent();
    createCollapseBtn();

    // 普通字段复制
    document.querySelectorAll('.field-value.copyable').forEach(function(el) {
      el.addEventListener('click', function() { copyValue(this); });
    });

    // 密码字段验证
    document.querySelectorAll('.password-masked').forEach(function(el) {
      el.addEventListener('click', function() { handlePasswordClick(this); });
    });

    // 侧边栏统一事件委托 — 处理折叠和锚点跳转
    document.querySelector('.sidebar').addEventListener('click', function(e) {
      var target = e.target;

      // 情况1：点击折叠触发器 → 折叠展开
      if (target.classList && target.classList.contains('fold-trigger')) {
        e.preventDefault();
        e.stopPropagation();
        var h3 = target.closest('h3[data-group]');
        if (h3) {
          var groupKey = h3.getAttribute('data-group');
          toggleGroup(null, groupKey);
        }
        return;
      }

      // 情况2：点击整条平台条目（圆点、文字或其他区域）→ 跳转到对应锚点
      var h3 = target.closest('h3');
      if (h3) {
        var link = h3.querySelector('a[href^="#"]');
        if (link && link.href.includes('#')) {
          e.preventDefault();
          var href = link.getAttribute('href');
          var targetId = href.substring(1);
          var element = document.getElementById(targetId);
          if (element) {
            var headerOffset = 100;
            var pos = element.offsetTop - headerOffset;
            window.scrollTo({ top: pos, behavior: 'smooth' });
          } else {
            console.error('未找到锚点元素:', targetId);
          }
          return;
        }
      }

      // 情况3：点击锚点链接本身 → 滚动到目标（原有逻辑兼容）
      if (target.tagName === 'A' && target.href.includes('#') && target.closest('.sidebar')) {
        e.preventDefault();
        var href = target.getAttribute('href');
        var targetId = href.substring(1);
        var element = document.getElementById(targetId);
        if (element) {
          var headerOffset = 100;
          var pos = element.offsetTop - headerOffset;
          window.scrollTo({ top: pos, behavior: 'smooth' });
        } else {
          console.error('未找到锚点元素:', targetId);
        }
        return;
      }
    });
  });
</script>
